name: Rust

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Rust 1.89 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the minimum Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt

      - name: Select the minimum Rust toolchain
        run: rustup default 1.89.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run the Rust suite
        run: cargo test --locked

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Smoke-test a copied release binary
        shell: bash
        run: |
          set -euo pipefail

          scratch="$(mktemp -d "${RUNNER_TEMP}/zdev-smoke.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT

          mkdir -p "$scratch/bin" "$scratch/project"
          cp target/release/zdev "$scratch/bin/zdev"
          chmod +x "$scratch/bin/zdev"

          binary="$scratch/bin/zdev"
          "$binary" --version
          "$binary" --root "$scratch/project" init --record project
          "$binary" --root "$scratch/project" status

  source-package:
    name: Cargo source package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the minimum Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Select the minimum Rust toolchain
        run: rustup default 1.89.0

      - name: Build the Cargo source package
        run: cargo package --locked

      - name: Test source installation
        shell: bash
        run: |
          set -euo pipefail

          install_root="$RUNNER_TEMP/zdev-source-install"
          cargo install --path . --locked --root "$install_root"

          package_id=$(cargo pkgid --locked)
          version=${package_id##*#}
          version=${version##*@}
          sh scripts/release-smoke.sh \
            "$install_root/bin/zdev" \
            "$version"
