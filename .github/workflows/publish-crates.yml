name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag (e.g. v1.6.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select the release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || fromJson(inputs.plan || '{}').announcement_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable release tag such as v1.6.0" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify the GitHub release and package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false)' | jq -e .
          package_id=$(cargo pkgid --locked)
          version=${package_id##*#}
          version=${version##*@}
          test "$version" = "$RELEASE_VERSION"

      - name: Check whether the version is already published
        id: registry
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://index.crates.io/zd/ev/zdev > "$RUNNER_TEMP/zdev-index"
          if jq -e --arg version "$RELEASE_VERSION" 'select(.vers == $version)' "$RUNNER_TEMP/zdev-index" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "zdev $RELEASE_VERSION is already on crates.io"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the Cargo package
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the Cargo package
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
