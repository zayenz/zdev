name: Release artifact smoke tests

on:
  workflow_call:
    inputs:
      plan:
        description: The JSON release plan generated by dist
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive-smoke:
    name: archive smoke (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      APP_NAME: ${{ fromJson(inputs.plan).releases[0].app_name }}
      EXPECTED_VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
      TARGET: ${{ matrix.targets[0] }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download packaged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: artifacts

      - name: Verify and smoke-test archive
        shell: bash
        run: |
          set -euo pipefail

          archive="artifacts/${APP_NAME}-${TARGET}.tar.xz"
          checksum="${archive}.sha256"
          test -f "$archive"
          test -f "$checksum"

          if command -v sha256sum >/dev/null 2>&1; then
            (cd artifacts && sha256sum --check "$(basename "$checksum")")
          else
            (cd artifacts && shasum -a 256 --check "$(basename "$checksum")")
          fi

          unpacked="$RUNNER_TEMP/zdev-release-${TARGET}"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xJf "$archive" -C "$unpacked" --strip-components=1

          test -f "$unpacked/LICENSE"
          test -f "$unpacked/README.md"
          test -x "$unpacked/zd"

          if [[ "$TARGET" == *-unknown-linux-musl ]]; then
            if readelf -l "$unpacked/zd" | grep -q 'Requesting program interpreter'; then
              echo "musl release binary unexpectedly needs a dynamic interpreter" >&2
              exit 1
            fi
          fi

          smoke_script="$RUNNER_TEMP/release-smoke.sh"
          checkout_hold="$RUNNER_TEMP/zdev-source-checkout"
          cp scripts/release-smoke.sh "$smoke_script"
          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$checkout_hold"

          restore_checkout() {
            smoke_status=$?
            trap - EXIT
            mv "$checkout_hold" "$GITHUB_WORKSPACE"
            exit "$smoke_status"
          }
          trap restore_checkout EXIT

          sh "$smoke_script" "$unpacked/zd" "$EXPECTED_VERSION"

  global-artifact-smoke:
    name: global artifact smoke
    runs-on: ubuntu-22.04
    env:
      APP_NAME: ${{ fromJson(inputs.plan).releases[0].app_name }}
      EXPECTED_VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download publication artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-global
          path: release-publish

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: release-publish
          merge-multiple: true

      - name: Verify the exact publication inputs
        shell: bash
        run: |
          set -euo pipefail

          scripts/check-release-assets.sh release-publish "$APP_NAME"

          test -f release-publish/source.tar.gz
          test -f release-publish/source.tar.gz.sha256
          test -f release-publish/zdev-installer.sh

          archive_checksums=(release-publish/*.tar.xz.sha256)
          [[ ${#archive_checksums[@]} -eq 4 ]]
          for checksum in "${archive_checksums[@]}"; do
            hash=$(awk '{ print $1 }' "$checksum")
            grep -Fq "$hash" release-publish/zdev-installer.sh
          done

      - name: Install and smoke-test the source archive
        shell: bash
        run: |
          set -euo pipefail

          scratch="$RUNNER_TEMP/zdev-source-release"
          rm -rf "$scratch"
          mkdir -p "$scratch/source" "$scratch/install"
          tar -xzf release-publish/source.tar.gz -C "$scratch/source"

          source_roots=("$scratch/source"/*)
          [[ ${#source_roots[@]} -eq 1 ]]
          source_root=${source_roots[0]}
          test -d "$source_root"
          test -f "$source_root/Cargo.toml"
          test -f "$source_root/Cargo.lock"
          test -f "$source_root/LICENSE"
          test -f "$source_root/README.md"

          cargo install \
            --path "$source_root" \
            --locked \
            --root "$scratch/install"
          sh scripts/release-smoke.sh \
            "$scratch/install/bin/zd" \
            "$EXPECTED_VERSION"

  installer-smoke:
    name: installer smoke (${{ join(matrix.targets, ', ') }})
    needs: global-artifact-smoke
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      APP_NAME: ${{ fromJson(inputs.plan).releases[0].app_name }}
      EXPECTED_VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
      TARGET: ${{ matrix.targets[0] }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download packaged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: release-artifacts

      - name: Download generated installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-global
          path: release-global

      - name: Install and smoke-test
        shell: bash
        run: |
          set -euo pipefail

          scratch="$RUNNER_TEMP/zdev-installer-${TARGET}"
          checkout_hold="$RUNNER_TEMP/zdev-source-checkout"
          rm -rf "$scratch" "$checkout_hold"
          mkdir -p \
            "$scratch/download" \
            "$scratch/home" \
            "$scratch/tmp" \
            "$scratch/xdg" \
            "$scratch/tools"

          archive="${APP_NAME}-${TARGET}.tar.xz"
          cp "release-artifacts/$archive" "$scratch/download/$archive"
          cp release-global/zdev-installer.sh "$scratch/installer.sh"
          cp scripts/release-smoke.sh "$scratch/release-smoke.sh"

          for tool in \
            awk basename cat chmod cp curl dirname grep mkdir mktemp mv rm \
            sed tar touch uname
          do
            tool_path=$(command -v "$tool")
            ln -s "$tool_path" "$scratch/tools/$tool"
          done
          for tool in sha256sum xz; do
            if tool_path=$(command -v "$tool" 2>/dev/null); then
              ln -s "$tool_path" "$scratch/tools/$tool"
            fi
          done

          cd "$RUNNER_TEMP"
          mv "$GITHUB_WORKSPACE" "$checkout_hold"

          restore_checkout() {
            smoke_status=$?
            trap - EXIT
            mv "$checkout_hold" "$GITHUB_WORKSPACE"
            exit "$smoke_status"
          }
          trap restore_checkout EXIT

          HOME="$scratch/home" \
          XDG_CONFIG_HOME="$scratch/xdg" \
          TMPDIR="$scratch/tmp" \
          ZDEV_INSTALL_DIR="$scratch/prefix" \
          ZDEV_NO_MODIFY_PATH=1 \
          ZDEV_DISABLE_UPDATE=1 \
          ZDEV_DOWNLOAD_URL="file://$scratch/download" \
          PATH="$scratch/tools" \
            /bin/sh "$scratch/installer.sh"

          test -x "$scratch/prefix/bin/zd"
          sh "$scratch/release-smoke.sh" \
            "$scratch/prefix/bin/zd" \
            "$EXPECTED_VERSION"
